name: CI

permissions:
  contents: read

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # HA 2024.x — pinned to py3.12 (HA didn't ship py3.13 wheels until
          # 2024.12). josepy<2 keeps the `acme` lib HA 2024.7 pins from
          # breaking on the josepy symbol removed in 2.x.
          - python-version: "3.12"
            ha-version: "2024"
            phacc-pin: "pytest-homeassistant-custom-component==0.13.145"
            extra-pins: "josepy<2"
          # HA 2025.x — pycares<5 keeps aiodns 3.5 (which HA 2025.12 ships)
          # from breaking on the symbol removed in pycares 5.x.
          - python-version: "3.13"
            ha-version: "2025"
            phacc-pin: "pytest-homeassistant-custom-component==0.13.298"
            extra-pins: "pycares<5"
          # HA 2026.x — highest phacc compatible with Python 3.13.
          - python-version: "3.13"
            ha-version: "2026"
            phacc-pin: "pytest-homeassistant-custom-component==0.13.316"
            extra-pins: ""
    name: test (py${{ matrix.python-version }}, HA ${{ matrix.ha-version }})
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      # phacc pins pytest-asyncio transitively, so we don't list it here —
      # listing requirements-dev.txt's >=1.3.0 floor would conflict with the
      # py3.12/HA 2024 cell, which phacc ties to pytest-asyncio 0.23.x.
      # Specs are written to a requirements file so bash doesn't parse `<` in
      # version specifiers (e.g. `josepy<2`) as input redirection.
      run: |
        python -m pip install --upgrade pip
        cat > /tmp/cell-requirements.txt <<'EOF'
        pytest
        pytest-cov
        voluptuous
        ${{ matrix.phacc-pin }}
        ${{ matrix.extra-pins }}
        EOF
        pip install -r /tmp/cell-requirements.txt

    - name: Show resolved HA version
      run: python -c "from homeassistant.const import __version__; print('HA', __version__)"

    - name: Run tests
      run: |
        python run_tests.py

    - name: Upload coverage to Codecov
      if: matrix.ha-version == '2026'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run custom validation
      run: |
        python validate.py

  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Install pyright
      run: |
        npm install -g pyright

    - name: Run type checking
      run: |
        pyright

  hacs-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: HACS validation
      uses: hacs/action@main
      with:
        category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Run hassfest
      uses: home-assistant/actions/hassfest@master

  release:
    needs: [test, validate, type-check, lint, hacs-validation]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
        name: ${{ github.ref_name }}
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        token: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run linting
      run: |
        black --check --diff custom_components/custom_areas/
        isort --check-only --diff custom_components/custom_areas/
        flake8 custom_components/custom_areas/
        ruff check custom_components/custom_areas/
        cd custom_components && python -m mypy custom_areas/
